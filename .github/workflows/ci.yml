name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat test

  tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Validate example policy against the JSON schema
        working-directory: .
        run: |
          pip install "jsonschema>=4.18"
          python -c "import json, yaml, jsonschema; jsonschema.Draft202012Validator(json.load(open('schemas/policy.schema.json'))).validate(yaml.safe_load(open('policies/example-primary.yaml'))); print('policy schema ok')"
      - name: CLI smoke test
        working-directory: .
        run: |
          vpr policy-hash policies/example-primary.yaml
          vpr compile-rpz policies/example-primary.yaml --feeds-dir examples/feeds --block-page block.example.org > /dev/null
          vpr aggregate examples/events.csv --day 2026-11-01 --k 10 --out-csv dataset.csv > summary.json
          python -c "import json, jsonschema; jsonschema.Draft202012Validator(json.load(open('schemas/dataset.schema.json'))).validate(json.load(open('summary.json'))); print('dataset schema ok')"
          vpr aggregate examples/public-service/events.csv --k 10 --unit-column unit_id > service-summary.json
          python -c "import json, jsonschema; jsonschema.Draft202012Validator(json.load(open('schemas/dataset.schema.json'))).validate(json.load(open('service-summary.json'))); print('dataset schema ok (unit_id)')"
          ROOT=$(python -c "import json; print(json.load(open('summary.json'))['root'])")
          vpr verify-root dataset.csv "$ROOT"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: contracts
      - run: pip install -e tools
      - name: End-to-end demo
        run: E2E_OUT=e2e-out ./examples/e2e/run.sh
      - name: Release benchmark (synthetic rows)
        run: python tools/bench/bench_merkle.py | tee e2e-out/bench-merkle.json
      - name: Upload demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-evidence
          path: e2e-out/
          if-no-files-found: warn

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check internal links and anchors
        run: python .github/scripts/check_links.py
