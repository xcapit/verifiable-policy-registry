<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="960" height="420" fill="#ffffff"/>
<text x="40" y="32" font-size="17" font-weight="600" fill="#0f172a">Dataset format 2 and the life of one anchored day</text>

<!-- Merkle tree, left -->
<g font-size="11">
<text x="220" y="62" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">MERKLE TREE (three rows)</text>
<rect x="188" y="74" width="64" height="26" rx="4" fill="#2563eb"/><text x="220" y="91" font-weight="600" fill="#fff" text-anchor="middle">root</text>
<rect x="112" y="138" width="64" height="26" rx="4" fill="#bfdbfe" stroke="#2563eb"/><text x="144" y="155" fill="#0f172a" text-anchor="middle">N₀₁</text>
<rect x="40" y="206" width="64" height="26" rx="4" fill="#eff6ff" stroke="#2563eb"/><text x="72" y="223" fill="#0f172a" text-anchor="middle">L₀</text>
<rect x="184" y="206" width="64" height="26" rx="4" fill="#eff6ff" stroke="#2563eb"/><text x="216" y="223" fill="#0f172a" text-anchor="middle">L₁</text>
<rect x="328" y="206" width="64" height="26" rx="4" fill="#eff6ff" stroke="#2563eb"/><text x="360" y="223" fill="#0f172a" text-anchor="middle">L₂</text>
<g stroke="#2563eb" fill="none"><path d="M72,206 L136,164"/><path d="M216,206 L152,164"/><path d="M144,138 L208,100"/><path d="M360,206 L360,120 L234,100" stroke-dasharray="3 3"/></g>
<text x="366" y="160" fill="#1d4ed8">odd node</text><text x="366" y="173" fill="#1d4ed8">promoted</text>
<rect x="40" y="252" width="360" height="62" rx="6" fill="#f8fafc" stroke="#64748b"/>
<text x="52" y="272" fill="#0f172a">L = keccak(0x00 ‖ day:u32 ‖ count:u256 ‖</text>
<text x="80" y="287" fill="#0f172a">len:u16 ‖ unit ‖ len:u16 ‖ category)</text>
<text x="52" y="305" fill="#0f172a">N = keccak(0x01 ‖ min(a, b) ‖ max(a, b))</text>
<text x="40" y="334" fill="#475569">Tags separate leaves from nodes; lengths make the</text>
<text x="40" y="348" fill="#475569">encoding unambiguous; the day binds a row to one date.</text>
<text x="40" y="362" fill="#475569">verifyRow computes the leaf from the row itself.</text>
</g>
<line x1="440" y1="56" x2="440" y2="404" stroke="#e2e8f0" stroke-width="2"/>

<!-- state machine, right -->
<g font-size="12">
<text x="700" y="62" font-weight="600" fill="#475569" text-anchor="middle">STATE OF (scope, day) IN MetricsAnchor</text>
<rect x="600" y="76" width="200" height="40" rx="20" fill="#f8fafc" stroke="#64748b"/>
<text x="700" y="94" font-weight="600" fill="#0f172a" text-anchor="middle">Unanchored</text><text x="700" y="109" font-size="11" fill="#475569" text-anchor="middle">day open, or not yet published</text>
<rect x="480" y="190" width="180" height="44" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="570" y="209" font-weight="600" fill="#0f172a" text-anchor="middle">Committed</text><text x="570" y="225" font-size="11" fill="#475569" text-anchor="middle">root · datasetUri · revision 0</text>
<rect x="740" y="190" width="180" height="44" rx="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="830" y="209" font-weight="600" fill="#0f172a" text-anchor="middle">Empty</text><text x="830" y="225" font-size="11" fill="#475569" text-anchor="middle">nothing publishable</text>
<rect x="590" y="310" width="220" height="44" rx="22" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="700" y="329" font-weight="600" fill="#0f172a" text-anchor="middle">Corrected · revision n</text><text x="700" y="345" font-size="11" fill="#475569" text-anchor="middle">root, or empty again</text>
</g>
<g stroke="#334155" stroke-width="1.3" fill="none">
<path d="M650,116 L585,186" marker-end="url(#a)"/>
<path d="M750,116 L815,186" marker-end="url(#a)"/>
<path d="M570,234 L640,306" stroke="#d97706" marker-end="url(#a)"/>
<path d="M830,234 L760,306" stroke="#d97706" marker-end="url(#a)"/>
</g>
<g font-size="11">
<text x="596" y="132" fill="#0f172a" text-anchor="end">commitRoot</text><text x="596" y="146" fill="#475569" text-anchor="end">publisher · once</text><text x="596" y="160" fill="#475569" text-anchor="end">day ended, within lag</text>
<text x="800" y="142" fill="#0f172a">markEmpty</text><text x="800" y="156" fill="#475569">same rules</text>
<text x="490" y="276" fill="#92400e">correctRoot</text><text x="490" y="290" fill="#92400e">governor only</text>
<text x="800" y="276" fill="#92400e">correctRoot</text><text x="800" y="290" fill="#92400e">reason hash</text>
<text x="700" y="376" fill="#92400e" text-anchor="middle">repeatable; each emits RootCorrected</text>
<text x="700" y="390" fill="#92400e" text-anchor="middle">(previous root, new root, URI, reason)</text>
<text x="700" y="410" fill="#475569" text-anchor="middle">The publisher can never rewrite a day.</text>
</g>
</svg>
