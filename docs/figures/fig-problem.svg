<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="960" height="360" fill="#ffffff"/>
<text x="40" y="32" font-size="17" font-weight="600" fill="#0f172a">One mechanism, two outcomes: what differs is who can check it</text>

<!-- left: opaque filter -->
<text x="250" y="66" font-size="13" font-weight="600" fill="#dc2626" text-anchor="middle">Opaque filter</text>
<rect x="60" y="80" width="380" height="150" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="250" y="104" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Operator</text>
<rect x="84" y="118" width="104" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
<text x="136" y="137" font-size="12" fill="#0f172a" text-anchor="middle">filter</text><text x="136" y="152" font-size="12" fill="#0f172a" text-anchor="middle">configuration</text>
<rect x="198" y="118" width="104" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
<text x="250" y="137" font-size="12" fill="#0f172a" text-anchor="middle">change</text><text x="250" y="152" font-size="12" fill="#0f172a" text-anchor="middle">log</text>
<rect x="312" y="118" width="104" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
<text x="364" y="137" font-size="12" fill="#0f172a" text-anchor="middle">query</text><text x="364" y="152" font-size="12" fill="#0f172a" text-anchor="middle">logs</text>
<text x="250" y="190" font-size="12" fill="#475569" text-anchor="middle">decides, enforces, records and reports:</text>
<text x="250" y="207" font-size="12" fill="#475569" text-anchor="middle">the custodian of the log is the party it should check</text>
<path d="M250,230 L250,262" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="266" width="380" height="64" rx="8" fill="#f8fafc" stroke="#64748b"/>
<text x="250" y="290" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">The public cannot learn</text>
<text x="250" y="310" font-size="12" fill="#475569" text-anchor="middle">what is blocked · who decided · for how long · what is logged</text>

<!-- right: VPR -->
<text x="710" y="66" font-size="13" font-weight="600" fill="#059669" text-anchor="middle">Verifiable Policy Registry</text>
<rect x="520" y="80" width="190" height="60" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
<text x="615" y="104" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Governor (m-of-n)</text>
<text x="615" y="122" font-size="12" fill="#475569" text-anchor="middle">decides the policy</text>
<rect x="730" y="80" width="190" height="60" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
<text x="825" y="104" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Operator</text>
<text x="825" y="122" font-size="12" fill="#475569" text-anchor="middle">enforces it, declares no logs</text>
<rect x="520" y="170" width="190" height="60" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
<text x="615" y="194" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Reviewer, auditor</text>
<text x="615" y="212" font-size="12" fill="#475569" text-anchor="middle">certify the deployment</text>
<rect x="730" y="170" width="190" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="825" y="194" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Public ledger</text>
<text x="825" y="212" font-size="12" fill="#475569" text-anchor="middle">holds the record</text>
<path d="M615,140 L760,170" stroke="#334155" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M825,140 L825,166" stroke="#334155" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M710,200 L726,200" stroke="#334155" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M825,230 L825,262" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="520" y="266" width="400" height="64" rx="8" fill="#f8fafc" stroke="#64748b"/>
<text x="720" y="290" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Anyone can check</text>
<text x="720" y="310" font-size="12" fill="#475569" text-anchor="middle">the version in force · its authorisers · its expiry · appeals · roots</text>
<line x1="480" y1="70" x2="480" y2="330" stroke="#e2e8f0" stroke-width="2"/>
</svg>
