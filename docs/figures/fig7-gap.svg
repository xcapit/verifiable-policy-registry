<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="960" height="370" fill="#ffffff"/>
<text x="40" y="32" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start">The enforcement–accountability gap, link by link</text>
