<line x1="230" y1="100" x2="230" y2="150" stroke="#d97706" stroke-dasharray="3 3"/>
<rect x="125" y="152" width="210" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
