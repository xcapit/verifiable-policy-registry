<text x="230" y="195" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">reviewer black-box tests</text>
<text x="230" y="211" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">sampling · external audit</text>
