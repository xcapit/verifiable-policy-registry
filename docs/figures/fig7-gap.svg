<text x="730" y="195" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">binding Merkle commitment</text>
<text x="730" y="211" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">write-once anchor</text>
<rect x="625" y="248" width="210" height="58" rx="8" fill="#fff" stroke="#2563eb" stroke-dasharray="5 4"/>
<text x="730" y="272" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Domain-separated leaves</text>
<text x="730" y="290" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">RFC 9162-style tags</text>
<text x="18" y="195" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Today</text>
<text x="18" y="280" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Next</text>
<rect x="40" y="326" width="14" height="12" fill="#fffbeb" stroke="#d97706"/>
<text x="60" y="337" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">rests on a named party</text>
