<text x="230" y="290" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">measured, open-source resolver</text>
<line x1="430" y1="93" x2="527" y2="93" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="480" y1="100" x2="480" y2="150" stroke="#d97706" stroke-dasharray="3 3"/>
<rect x="375" y="152" width="210" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="480" y="175" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Operator honesty</text>
<text x="480" y="195" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">no cryptographic link</text>
<text x="480" y="211" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">between log and figures</text>
<rect x="375" y="248" width="210" height="58" rx="8" fill="#fff" stroke="#2563eb" stroke-dasharray="5 4"/>
