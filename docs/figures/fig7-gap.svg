<text x="355" y="88" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Event log</text>
<text x="355" y="107" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">(school, day, category)</text>
<rect x="530" y="60" width="150" height="66" rx="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
<text x="605" y="88" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Aggregate release</text>
<text x="605" y="107" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">k-suppressed table</text>
