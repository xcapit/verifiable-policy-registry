<text x="855" y="88" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">On-chain root</text>
<text x="855" y="107" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">MetricsAnchor</text>
