<text x="480" y="290" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">release = agg(log, k)</text>
<line x1="680" y1="93" x2="777" y2="93" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="730" y1="100" x2="730" y2="150" stroke="#2563eb" stroke-dasharray="3 3"/>
<rect x="625" y="152" width="210" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
