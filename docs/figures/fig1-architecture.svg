<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="960" height="610" fill="#ffffff"/>
  <text x="40" y="32" font-size="17" font-weight="600" fill="#0f172a">Two planes: enforcement in-country, accountability on-chain</text>

  <rect x="20" y="52" width="920" height="226" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="76" font-size="13" font-weight="600" fill="#475569">ENFORCEMENT PLANE · in-country, off-chain</text>

  <rect x="40" y="95" width="200" height="80" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="140" y="128" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">School network</text>
  <text x="140" y="149" font-size="12" fill="#475569" text-anchor="middle">student and teacher devices</text>
  <text x="140" y="165" font-size="12" fill="#475569" text-anchor="middle">nothing installed</text>

  <rect x="300" y="95" width="300" height="80" rx="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="125" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Filtering resolver pair</text>
  <text x="450" y="146" font-size="12" fill="#475569" text-anchor="middle">RPZ · DNSSEC · DoT / DoH</text>
  <text x="450" y="163" font-size="12" fill="#059669" text-anchor="middle">no query logs, declared per RFC 8932</text>

  <rect x="690" y="95" width="230" height="80" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="805" y="130" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Internet</text>
  <text x="805" y="151" font-size="12" fill="#475569" text-anchor="middle">allowed sites</text>

  <rect x="430" y="205" width="210" height="52" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="535" y="227" font-size="13" font-weight="600" fill="#065f46" text-anchor="middle">Metrics exporter</text>
  <text x="535" y="245" font-size="12" fill="#065f46" text-anchor="middle">(school, day, category) only</text>

  <rect x="690" y="205" width="230" height="52" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="805" y="227" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Block page</text>
  <text x="805" y="245" font-size="12" fill="#475569" text-anchor="middle">explains block · links to appeal</text>

  <line x1="240" y1="135" x2="297" y2="135" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="268" y="127" font-size="11" fill="#475569" text-anchor="middle">DNS</text>
  <line x1="600" y1="125" x2="687" y2="125" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="645" y="117" font-size="11" fill="#475569" text-anchor="middle">allowed</text>
  <path d="M600,160 L660,160 L660,231 L687,231" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="666" y="196" font-size="11" fill="#475569">blocked</text>
  <line x1="535" y1="175" x2="535" y2="202" stroke="#059669" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="20" y="330" width="920" height="150" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="420" y="354" font-size="13" font-weight="600" fill="#1d4ed8">ACCOUNTABILITY PLANE · Ethereum L2</text>

  <rect x="40" y="370" width="260" height="92" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="396" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">VerifiablePolicyRegistry</text>
  <text x="170" y="416" font-size="12" fill="#475569" text-anchor="middle">versions: hash · reason · expiry</text>
  <text x="170" y="433" font-size="12" fill="#475569" text-anchor="middle">appeals: open → accepted / rejected</text>
  <text x="170" y="450" font-size="12" fill="#475569" text-anchor="middle">governor = Safe m-of-n</text>

  <rect x="350" y="370" width="260" height="92" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="396" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">EAS + IssuerRoleResolver</text>
  <text x="480" y="416" font-size="12" fill="#475569" text-anchor="middle">Deployment (operator)</text>
  <text x="480" y="433" font-size="12" fill="#475569" text-anchor="middle">IndependentTest (reviewer)</text>
  <text x="480" y="450" font-size="12" fill="#475569" text-anchor="middle">Conformance (auditor)</text>

  <rect x="660" y="370" width="260" height="92" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="790" y="396" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">MetricsAnchor</text>
  <text x="790" y="416" font-size="12" fill="#475569" text-anchor="middle">one Merkle root per scope per day</text>
  <text x="790" y="433" font-size="12" fill="#475569" text-anchor="middle">publisher once · governor corrects</text>
  <text x="790" y="450" font-size="12" fill="#475569" text-anchor="middle">on-chain row verification</text>

  <path d="M250,370 L250,300 L340,300 L340,178" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="242" y="318" font-size="11" fill="#1d4ed8" text-anchor="end">policy in force</text>
  <text x="242" y="332" font-size="11" fill="#1d4ed8" text-anchor="end">(hash-checked)</text>
  <line x1="390" y1="280" x2="390" y2="367" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="398" y="318" font-size="11" fill="#475569">deployment and</text>
  <text x="398" y="332" font-size="11" fill="#475569">test attestations</text>
  <path d="M600,257 L600,300 L790,300 L790,367" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="640" y="294" font-size="11" fill="#065f46">daily root of suppressed counts</text>

  <rect x="40" y="525" width="260" height="56" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="170" y="549" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">Governor · Safe 2-of-3</text>
  <text x="170" y="567" font-size="12" fill="#92400e" text-anchor="middle">UNICEF Giga · Ministry · Reviewer</text>
  <line x1="170" y1="525" x2="170" y2="465" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="178" y="500" font-size="11" fill="#92400e">publishPolicy</text>

  <rect x="350" y="525" width="570" height="56" rx="8" fill="#fff" stroke="#334155"/>
  <text x="635" y="549" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Public dashboard · any verifier</text>
  <text x="635" y="567" font-size="12" fill="#475569" text-anchor="middle">donors · auditors · ministries · researchers · families</text>
  <line x1="480" y1="462" x2="480" y2="522" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="790" y1="462" x2="790" y2="522" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M300,445 L325,445 L325,553 L347,553" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
