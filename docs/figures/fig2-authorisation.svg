<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="960" height="340" fill="#ffffff"/>
  <text x="40" y="32" font-size="17" font-weight="600" fill="#0f172a">Figure 2. A policy changes only with a threshold of signatures, and every version expires</text>

  <rect x="40" y="85" width="180" height="70" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="130" y="112" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Change proposed</text>
  <text x="130" y="131" font-size="12" fill="#475569" text-anchor="middle">full document,</text>
  <text x="130" y="146" font-size="12" fill="#475569" text-anchor="middle">every entry with a reason</text>

  <polygon points="330,65 410,120 330,175 250,120" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="330" y="116" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">≥ m of n</text>
  <text x="330" y="133" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">signatures?</text>

  <rect x="450" y="85" width="220" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="560" y="112" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Version appended</text>
  <text x="560" y="131" font-size="12" fill="#475569" text-anchor="middle">hash · reason · expiry</text>
  <text x="560" y="146" font-size="12" fill="#475569" text-anchor="middle">append-only, public</text>

  <rect x="720" y="85" width="200" height="70" rx="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <text x="820" y="112" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Resolver applies vN</text>
  <text x="820" y="131" font-size="12" fill="#475569" text-anchor="middle">only if the document</text>
  <text x="820" y="146" font-size="12" fill="#475569" text-anchor="middle">hashes to the on-chain h</text>

  <rect x="240" y="230" width="180" height="60" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="330" y="255" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">No change</text>
  <text x="330" y="274" font-size="12" fill="#475569" text-anchor="middle">previous version stays</text>

  <rect x="450" y="230" width="220" height="60" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="560" y="255" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Expired, not renewed</text>
  <text x="560" y="274" font-size="12" fill="#475569" text-anchor="middle">fallback: protective categories</text>

  <rect x="720" y="230" width="200" height="60" rx="8" fill="#fff" stroke="#334155"/>
  <text x="820" y="255" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Reviewer attests school</text>
  <text x="820" y="274" font-size="12" fill="#475569" text-anchor="middle">EAS IndependentTest</text>

  <rect x="40" y="230" width="180" height="60" rx="8" fill="#fff" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="130" y="255" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Appeal (anyone)</text>
  <text x="130" y="274" font-size="12" fill="#475569" text-anchor="middle">via the block page</text>
  <text x="130" y="312" font-size="11" fill="#475569" text-anchor="middle">rejection is also recorded on-chain</text>

  <line x1="220" y1="120" x2="247" y2="120" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="410" y1="120" x2="447" y2="120" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="428" y="112" font-size="11" fill="#475569" text-anchor="middle">yes</text>
  <line x1="670" y1="120" x2="717" y2="120" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="330" y1="175" x2="330" y2="227" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="338" y="205" font-size="11" fill="#475569">no</text>
  <line x1="560" y1="155" x2="560" y2="227" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="568" y="196" font-size="11" fill="#475569">validity ≤ Δmax elapses</text>
  <line x1="820" y1="155" x2="820" y2="227" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="130" y1="230" x2="130" y2="158" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="138" y="196" font-size="11" fill="#475569">accepted → new version</text>
</svg>
