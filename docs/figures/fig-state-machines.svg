<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="960" height="380" fill="#ffffff"/>
<text x="40" y="32" font-size="17" font-weight="600" fill="#0f172a">Registry state machines: appeals and governor handover</text>

<!-- appeals -->
<text x="240" y="64" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">APPEAL FOR ONE DOCUMENT HASH</text>
<g font-size="12">
<rect x="40" y="150" width="90" height="36" rx="18" fill="#f8fafc" stroke="#64748b"/><text x="85" y="173" font-weight="600" fill="#0f172a" text-anchor="middle">None</text>
<rect x="190" y="150" width="100" height="36" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="240" y="167" font-weight="600" fill="#0f172a" text-anchor="middle">Open</text><text x="240" y="180" font-size="10" fill="#475569" text-anchor="middle">round r</text>
<rect x="340" y="86" width="110" height="36" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="395" y="109" font-weight="600" fill="#0f172a" text-anchor="middle">Accepted</text>
<rect x="340" y="214" width="110" height="36" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="395" y="237" font-weight="600" fill="#0f172a" text-anchor="middle">Rejected</text>
</g>
<g stroke="#334155" stroke-width="1.3" fill="none">
<path d="M130,168 L186,168" marker-end="url(#a)"/>
<path d="M290,160 L336,112" marker-end="url(#a)"/>
<path d="M290,176 L336,224" marker-end="url(#a)"/>
<path d="M395,250 L395,290 L240,290 L240,190" stroke-dasharray="5 4" marker-end="url(#a)"/>
</g>
<g font-size="11">
<text x="158" y="146" fill="#0f172a" text-anchor="middle">fileAppeal</text><text x="158" y="200" fill="#475569" text-anchor="middle">anyone</text>
<text x="306" y="128" fill="#0f172a" text-anchor="end">publishPolicy</text><text x="300" y="72" fill="#475569"></text>
<text x="462" y="100" fill="#475569">new version with</text><text x="462" y="114" fill="#475569">reason code 3</text>
<text x="462" y="228" fill="#475569">rejectAppeal</text><text x="462" y="242" fill="#475569">with reason hash</text>
<text x="318" y="306" fill="#475569" text-anchor="middle">fileAppeal again: round r + 1</text>
<text x="40" y="334" fill="#475569">Only the hash is stored; the filer is not recorded.</text>
<text x="40" y="350" fill="#475569">Open and Accepted cannot be filed again; rounds are</text>
<text x="40" y="366" fill="#475569">resubmissions, not an escalation count.</text>
</g>
<line x1="560" y1="56" x2="560" y2="370" stroke="#e2e8f0" stroke-width="2"/>

<!-- handover -->
<text x="760" y="64" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">GOVERNOR HANDOVER</text>
<g font-size="12">
<rect x="660" y="80" width="200" height="40" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="760" y="98" font-weight="600" fill="#0f172a" text-anchor="middle">Governor G</text><text x="760" y="112" font-size="10" fill="#475569" text-anchor="middle">no pending proposal</text>
<rect x="660" y="180" width="200" height="40" rx="20" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="760" y="198" font-weight="600" fill="#0f172a" text-anchor="middle">Pending G′</text><text x="760" y="212" font-size="10" fill="#475569" text-anchor="middle">G keeps full power</text>
<rect x="660" y="280" width="200" height="40" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="760" y="298" font-weight="600" fill="#0f172a" text-anchor="middle">Governor G′</text><text x="760" y="312" font-size="10" fill="#475569" text-anchor="middle">G loses all rights</text>
</g>
<g stroke="#334155" stroke-width="1.3" fill="none">
<path d="M730,120 L730,176" marker-end="url(#a)"/>
<path d="M790,180 L790,124" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M760,220 L760,276" marker-end="url(#a)"/>
</g>
<g font-size="11">
<text x="722" y="146" fill="#0f172a" text-anchor="end">proposeGovernor(G′)</text><text x="722" y="160" fill="#475569" text-anchor="end">by G</text>
<text x="798" y="146" fill="#0f172a">propose(0): cancel</text>
<text x="752" y="246" fill="#0f172a" text-anchor="end">acceptGovernor</text><text x="752" y="260" fill="#475569" text-anchor="end">by G′ only</text>
<text x="580" y="344" fill="#dc2626">Refused at every step: an address holding an issuer role</text>
<text x="580" y="360" fill="#dc2626">cannot be proposed, given a role while pending, or accept.</text>
</g>
</svg>
