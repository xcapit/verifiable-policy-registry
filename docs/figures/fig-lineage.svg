<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="960" height="380" fill="#ffffff"/>
<text x="40" y="32" font-size="17" font-weight="600" fill="#0f172a">What each line of prior work contributes to the design</text>
<text x="190" y="64" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">PRIOR WORK</text>
<text x="770" y="64" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">VPR COMPONENT</text>

<g font-size="12">
<rect x="40" y="76" width="300" height="42" rx="6" fill="#f8fafc" stroke="#64748b"/>
<text x="56" y="94" font-weight="600" fill="#0f172a">Protective DNS, RPZ, NIST SP 800-81r3</text>
<text x="56" y="110" fill="#475569">filtering at the resolver, standard zones</text>
<rect x="40" y="128" width="300" height="42" rx="6" fill="#f8fafc" stroke="#64748b"/>
<text x="56" y="146" font-weight="600" fill="#0f172a">Certificate Transparency, CONIKS, Rekor</text>
<text x="56" y="162" fill="#475569">public, append-only logs of decisions</text>
<rect x="40" y="180" width="300" height="42" rx="6" fill="#f8fafc" stroke="#64748b"/>
<text x="56" y="198" font-weight="600" fill="#0f172a">OONI and external measurement</text>
<text x="56" y="214" fill="#475569">tests by a party other than the operator</text>
<rect x="40" y="232" width="300" height="42" rx="6" fill="#f8fafc" stroke="#64748b"/>
<text x="56" y="250" font-weight="600" fill="#0f172a">EAS, W3C Verifiable Credentials</text>
<text x="56" y="266" fill="#475569">schemas for verifiable claims</text>
<rect x="40" y="284" width="300" height="42" rx="6" fill="#f8fafc" stroke="#64748b"/>
<text x="56" y="302" font-weight="600" fill="#0f172a">Suppression, differential privacy, Prio</text>
<text x="56" y="318" fill="#475569">what a published aggregate may reveal</text>
<rect x="40" y="336" width="300" height="34" rx="6" fill="#f8fafc" stroke="#64748b"/>
<text x="56" y="358" font-weight="600" fill="#0f172a">Safe multisignature accounts</text>

<rect x="600" y="76" width="320" height="42" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
<text x="616" y="94" font-weight="600" fill="#0f172a">Enforcement plane</text>
<text x="616" y="110" fill="#475569">resolver pair compiled from the policy in force</text>
<rect x="600" y="128" width="320" height="42" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
<text x="616" y="146" font-weight="600" fill="#0f172a">VerifiablePolicyRegistry</text>
<text x="616" y="162" fill="#475569">one history for all, no gossip needed (§3.2)</text>
<rect x="600" y="180" width="320" height="42" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
<text x="616" y="198" font-weight="600" fill="#0f172a">Independent test attestations</text>
<text x="616" y="214" fill="#475569">from inside the school network</text>
<rect x="600" y="232" width="320" height="42" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
<text x="616" y="250" font-weight="600" fill="#0f172a">Three schemas + IssuerRoleResolver</text>
<text x="616" y="266" fill="#475569">one issuer role per schema</text>
<rect x="600" y="284" width="320" height="42" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
<text x="616" y="302" font-weight="600" fill="#0f172a">Aggregator, MetricsAnchor, ZK (designed)</text>
<text x="616" y="318" fill="#475569">small-cell suppression, bound to a root</text>
<rect x="600" y="336" width="320" height="34" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
<text x="616" y="358" font-weight="600" fill="#0f172a">Governor (threshold authorisation)</text>
</g>
<g stroke="#334155" stroke-width="1.2" fill="none">
<path d="M340,97 L596,97" marker-end="url(#a)"/>
<path d="M340,149 L596,149" marker-end="url(#a)"/>
<path d="M340,201 L596,201" marker-end="url(#a)"/>
<path d="M340,253 L596,253" marker-end="url(#a)"/>
<path d="M340,305 L596,305" marker-end="url(#a)"/>
<path d="M340,353 L596,353" marker-end="url(#a)"/>
</g>
<g font-size="11" fill="#475569" text-anchor="middle">
<text x="468" y="91">compile and enforce</text>
<text x="468" y="143">log every decision publicly</text>
<text x="468" y="195">separate measurer from operator</text>
<text x="468" y="247">record claims and issuers</text>
<text x="468" y="299">bound disclosure, bind outputs</text>
<text x="468" y="347">m-of-n over contract calls</text>
</g>
</svg>
