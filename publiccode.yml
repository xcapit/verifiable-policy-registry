publiccodeYmlVersion: "0.4"
name: Verifiable Policy Registry
url: "https://github.com/xcapit/verifiable-policy-registry"
softwareVersion: "0.1.0"
releaseDate: "2026-11-09"
platforms: [web, linux]
categories: [data-collection, it-security]
developmentStatus: development
softwareType: standalone/other
description:
  en:
    shortDescription: >-
      Public, multisig-governed and contestable content-filtering policies for school networks,
      with independent attestations and k-anonymous impact metrics.
    longDescription: >-
      The Verifiable Policy Registry turns a content-filtering policy into a public object: every
      version is published in full with its reasons, signed by several institutions, time-limited and
      open to appeal. An independent reviewer, never the operator, attests that each school network
      applies the policy. Impact metrics are published only as k-anonymous aggregates with a daily
      Merkle commitment that anyone can recompute. Contracts run on an Ethereum L2 and store only
      commitments; the filtering itself is done by a standard DNS resolver using RPZ. The first
      deployment targets schools connected by UNICEF Giga.
    features:
      - Versioned, expiring filtering policies with reasons
      - Multisig governance and on-chain appeals
      - Separate issuers for deployment, test and conformance attestations
      - RPZ compilation for Unbound or PowerDNS
      - k-anonymous datasets with Merkle proofs
