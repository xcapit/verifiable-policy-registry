# Test configuration for the resolver check (examples/resolver, VPR-055). Not for deployment.
# It keeps the parts of ../rpz.conf that decide answers and logging: the module chain with the
# validator, QNAME minimisation, the logging settings and the RPZ section. It differs from ../rpz.conf
# in three ways, so that the test is local and hermetic:
#   - it listens on port 53 inside the container only, without DNS over TLS;
#   - it accepts queries from the loopback address only;
#   - instead of the internet it uses a local copy of a test root zone (upstream.zone), so every
#     answer comes from synthetic data and no query leaves the container. The zone is unsigned and
#     no trust anchor is configured, so the validator treats every answer as insecure.

server:
    interface: 127.0.0.1@53
    do-daemonize: no
    username: "unbound"
    chroot: ""
    directory: "/etc/unbound"
    use-syslog: no
    logfile: ""                       # stderr, read by the check with `docker logs`
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse
    qname-minimisation: yes
    harden-dnssec-stripped: yes

    # Privacy (see docs/PRIVACY_STATEMENT.md): no query logging. The check asserts it.
    verbosity: 1
    log-queries: no
    log-replies: no
    log-local-actions: no

    module-config: "respip validator iterator"

auth-zone:
    name: "."
    zonefile: "/etc/unbound/upstream.zone"
    for-upstream: yes
    for-downstream: no
    fallback-enabled: no

rpz:
    name: vpr.policy.
    zonefile: "/zones/policy.rpz"     # output of: vpr compile-rpz ... [--beacon <block-page-host>]
    rpz-log: no
