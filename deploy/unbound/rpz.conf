# Unbound configuration fragment for the pilot resolver (reference, not production-hardened).
# Checked with unbound-checkconf 1.25 after substituting real TLS, trust-anchor and zone files;
# it is not a validated deployment (see docs/CLAIMS_AND_EVIDENCE.md, C32).
# Aligned with NIST SP 800-81r3 recommendations: DNSSEC validation, QNAME minimisation,
# encrypted DNS for clients, and protective DNS via RPZ.

server:
    interface: 0.0.0.0@53
    interface: 0.0.0.0@853            # DNS over TLS (RFC 7858)
    # DNS over HTTPS (RFC 8484) requires Unbound built with nghttp2:
    # interface: 0.0.0.0@443
    tls-service-key: "/etc/unbound/tls/server.key"
    tls-service-pem: "/etc/unbound/tls/server.pem"

    access-control: 0.0.0.0/0 refuse  # replace with the school / ISP ranges
    qname-minimisation: yes
    harden-dnssec-stripped: yes
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # Privacy (see docs/PRIVACY_STATEMENT.md): no query logging.
    verbosity: 1
    log-queries: no
    log-replies: no
    log-local-actions: no
    # RPZ hit counters are exported per category only, via the metrics exporter (planned, VPR-016).

    module-config: "respip validator iterator"

rpz:
    name: vpr.policy.
    zonefile: "/etc/unbound/vpr-policy.rpz"   # output of: vpr compile-rpz ...
    rpz-log: no
