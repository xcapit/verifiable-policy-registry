# Foundry is used only for fuzz and invariant tests (test-foundry/). Hardhat remains the build and unit-test
# tool. Both compile the same sources with the same pinned compiler and optimizer settings.
[profile.default]
src = "src"
test = "test-foundry"
out = "out-forge"
cache_path = "cache-forge"
libs = ["node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# forge-std is the official repository pinned by tag in package.json (commit recorded in package-lock.json)
remappings = ["forge-std/=node_modules/forge-std/src/"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# CI profile: more fuzz runs and deeper invariant campaigns.
[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 512
depth = 128
