[project]
name = "vpr-tools"
version = "0.1.0"
description = "Off-chain tooling for the Verifiable Policy Registry: policy hashing, RPZ compilation and k-anonymous metrics"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
dependencies = ["pycryptodome>=3.20", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vpr = "vpr.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
