# Example public policy document for a primary-school profile.
# This file is what gets published (for example on IPFS); its keccak256 over the canonical JSON
# form is the contentHash recorded on-chain. Every local block and exception must state a reason.
scope: "giga:XX:primary"          # XX = pilot country code, to be agreed with Giga
version: 1
profile: primary                   # primary | secondary | teachers
valid_days: 90                     # must not exceed the scope's maxValidity on-chain
reason_code: 1                     # 1 = initial_policy (see docs/GOVERNANCE.md)
categories:                        # mapped to ITU Child Online Protection content categories
  - malware
  - phishing
  - adult
threat_feeds:                      # third-party feeds are referenced by provider and version, not copied
  - provider: "example-threat-intel"
    version: "2026-11-01"
feed_hashes:                       # keccak256 of each category feed (vpr list-hash); binds feed contents to this version
  malware: "0xcaea08538723e6f92b3c2000c7caeecf944fe048d18c9bb2a155bfd3adce83db"
  phishing: "0x6a648280f076d00cc9316622dbc738713b922670c499b10da7a7da5ca855ea28"
  adult: "0x9ffdba0a6b8499e9020cfbbbe2745c4632951286653f465cbb064082025d920f"
restricted_list_hash: null         # set to the commitment of the IWF domain list in production
local_blocks:
  - domain: casino-example.example
    reason: "Online gambling; not age-appropriate for primary schools"
exceptions:
  - domain: wikipedia.org
    reason: "Educational reference; never blocked by category feeds"
  - domain: khanacademy.org
    reason: "Educational platform used in the national curriculum"
